{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Saved Address</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="address" class="form-label">Delivery / Pickup Address</label>
            <textarea class="form-control" id="address" name="address" rows="3">{{ form.address or '' }}</textarea>
            {% if errors.address %}
                <small class="text-danger">{{ errors.address }}</small>
            {% endif %}
        </div>

        <button type="submit" class="btn btn-primary">Save Address</button>
        <a href="{{ url_for('customer.profile') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
